<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <!-- Category Buttons -->
    <div class="filters">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('travel')">Travel</button>
        <button onclick="filterImages('city')">City</button>
    </div>

    <!-- Image Gallery -->
    <div class="gallery">

        <div class="image-card nature">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                 alt="Mountain">
        </div>

        <div class="image-card nature">
            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b"
                 alt="Forest">
        </div>

        <div class="image-card travel">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Beach">
        </div>

        <div class="image-card travel">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                 alt="Travel">
        </div>

        <div class="image-card city">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390"
                 alt="City">
        </div>

        <div class="image-card city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df"
                 alt="City">
        </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <button class="prev" onclick="previousImage()">&#10094;</button>

        <img id="lightboxImage">

        <button class="next" onclick="nextImage()">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
